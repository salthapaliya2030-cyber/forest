<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14221b" />
    <title>Wilderness — First Person Forest</title>
  </head>
  <body>
    <main id="app">
      <canvas id="scene" aria-label="first-person forest"></canvas>
      <div class="vignette"></div>
      <div class="hud-top"><span class="brand">WILDERNESS</span><span class="location">FOREST TRAIL · BICYCLE RIDE</span></div>
      
      <section class="intro" id="intro">
        <div class="intro-kicker">A QUIET RIDE</div>
        <h1>THE FOREST</h1>
        <p>follow the dirt trail through the trees. no destination, no rush.</p>
        <button id="enter" type="button">start riding <span>↗</span></button>
        <div class="control-hint">w to pedal&nbsp; · &nbsp;a/d to steer&nbsp; · &nbsp;s to brake&nbsp; · &nbsp;mouse to look</div>
      </section>
      <div class="speedometer"><span id="speedValue">00</span><small>km/h</small></div><div class="bottom-hint" id="bottomHint">click to ride · esc to release mouse</div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
